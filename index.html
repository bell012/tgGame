<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mask-icon.svg" />
    <!-- 提前加载游戏封面中英文标题字体，减少首次渲染时的字体切换。 -->
    <link rel="preload" href="/src/static/fonts/Impact.ttf" as="font" type="font/ttf" crossorigin />
    <link
      rel="preload"
      href="/src/static/fonts/infoma-ultra.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <!-- h5中禁止双击放大 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- Inter 字体（含 italic 斜体） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#323738" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TG Game" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa-icons/180.png" />
    <link rel="apple-touch-startup-image" href="/pwa-icons/1125.png" />
    <link rel="mask-icon" href="/mask-icon.svg" color="#323738" />

    <style>
      #pwa-splash-screen {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: none;
        background: #323738;
      }

      #pwa-splash-screen img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #pwa-splash-screen.is-hidden {
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }

      html.pwa-standalone #pwa-splash-screen {
        display: flex;
      }
    </style>

    <script>
      ;(() => {
        const isStandalone =
          window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone

        if (isStandalone) {
          document.documentElement.classList.add('pwa-standalone')
        }
      })()
    </script>

    <script>
      ;(() => {
        const DARK_THEME_COLOR = '#323738'
        const LIGHT_THEME_COLOR = '#ffffff'
        const DARK_PAGE_BACKGROUND = '#242626'
        const LIGHT_PAGE_BACKGROUND = '#f4f4f4'

        try {
          const savedTheme = localStorage.getItem('theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const resolvedTheme =
            savedTheme === 'dark' || savedTheme === 'light'
              ? savedTheme
              : prefersDark
                ? 'dark'
                : 'light'
          const themeColor = resolvedTheme === 'dark' ? DARK_THEME_COLOR : LIGHT_THEME_COLOR
          const pageBackground =
            resolvedTheme === 'dark' ? DARK_PAGE_BACKGROUND : LIGHT_PAGE_BACKGROUND
          const html = document.documentElement
          const themeColorMeta = document.querySelector('meta[name="theme-color"]')

          html.classList.remove('light', 'dark')
          html.classList.add(resolvedTheme)
          html.style.backgroundColor = pageBackground
          themeColorMeta?.setAttribute('content', themeColor)

          document.addEventListener(
            'DOMContentLoaded',
            () => {
              document.body.style.backgroundColor = pageBackground
            },
            { once: true }
          )
        } catch (error) {
          console.error('[theme-color:init]', error)
        }
      })()
    </script>

    <title>TG Game</title>
  </head>

  <body>
    <div id="pwa-splash-screen" aria-hidden="true">
      <img src="/pwa-icons/1125.png" alt="" />
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
